[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extract purchase invoice data from PDFs/PNGs and output ERPNext-ready JSON"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.60.0"]
google = ["google-genai>=1.0.0"]
all = ["anthropic>=0.40.0", "openai>=1.60.0", "google-genai>=1.0.0"]

[project.scripts]
extract-invoices = "src.main:main"
