[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Extract purchase invoice data from PDFs/PNGs and output ERPNext-ready JSON"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.60.0"]
google = ["google-genai>=1.0.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "python-multipart>=0.0.9"]
dev = ["pre-commit>=4.0.0", "ruff>=0.9.0", "mypy>=1.10.0"]
all = [
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "google-genai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[project.scripts]
extract-invoices = "src.main:main"
extract-invoices-api = "src.api:main"

# ── Ruff configuration ──────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

# ── MyPy configuration ──────────────────────────────────────────
[tool.mypy]
strict = false
pretty = true
incremental = true
sqlite_cache = true
files = ["src/"]
exclude = ['/test_.+\.py$']
